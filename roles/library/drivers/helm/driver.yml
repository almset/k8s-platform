---
# Явный контракт возможностей драйвера. Загружается через include_vars в
# run_phase.yml ПЕРЕД тем, как решить, вызывать ли фазу — вместо проверки
# наличия файла через stat(). API драйвера теперь описан декларативно, а не
# выводится из файловой системы.
driver_capabilities:
  install: true
  cleanup: true
  rollback: true
