---
- name: "Assert required catalog fields for {{ component_item.key }}"
  ansible.builtin.assert:
    that:
      - component_item.value.apiVersion is defined
      - component_item.value.apiVersion == 'platform.io/v1'
      - component_item.value.kind is defined
      - component_item.value.kind == 'Component'
      - component_item.value.spec is defined
      - component_item.value.spec.driver is defined
      - component_item.value.spec.dependencies is defined
      - component_item.value.spec.compatibility is defined
    fail_msg: >-
      catalog.yml entry for '{{ component_item.key }}' does not conform to
      schemas/catalog.schema.json. Run `make validate` for the full
      jsonschema report (this assert only checks the fields the engine
      dereferences at runtime).
  when: platform_strict_validation | default(true) | bool
